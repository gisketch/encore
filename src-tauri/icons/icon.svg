<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Encore app icon. The mark is the action bar's buffer glyph: three
       bars in the same 9 : 15 : 11 proportion, stadium rounding, and shared
       baseline the app draws, in paper cream on the accent green.

       The accent carries the body rather than the paper, because the paper
       treatment disappears against a light desktop and is unreadable below
       32px — checked side by side at 128 / 64 / 32 / 16 on light and dark.

       Source of truth for every platform icon. Regenerate the PNG/ICNS/ICO
       set with: npm run tauri icon src-tauri/icons/icon.svg -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#8aab7c"/>
      <stop offset="1" stop-color="#6b8b5f"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <clipPath id="body">
      <rect x="96" y="96" width="832" height="832" rx="186"/>
    </clipPath>
  </defs>

  <rect x="96" y="96" width="832" height="832" rx="186" fill="url(#accent)"/>

  <!-- The grain every Encore surface carries, kept faint so downscaling to
       16px leaves texture rather than noise. -->
  <g clip-path="url(#body)">
    <rect x="96" y="96" width="832" height="832" filter="url(#grain)" opacity="0.05"/>
  </g>

  <!-- Heights 252 / 420 / 308 hold the app's 9 : 15 : 11 ratio, bottom
       aligned on a shared baseline at y=722. -->
  <g fill="#fdfaf2">
    <rect x="288" y="470" width="96" height="252" rx="48"/>
    <rect x="464" y="302" width="96" height="420" rx="48"/>
    <rect x="640" y="414" width="96" height="308" rx="48"/>
  </g>

  <!-- A darker edge so the icon still has an outline on a light desktop. -->
  <rect x="97.5" y="97.5" width="829" height="829" rx="184.5"
        fill="none" stroke="#3f5236" stroke-opacity="0.22" stroke-width="3"/>
</svg>
