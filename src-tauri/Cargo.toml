[package]
name = "encore"
version = "0.1.0"
description = "A local replay buffer for reproducible QA evidence"
authors = ["Ghegi Jimenez"]
edition = "2021"

[lib]
name = "encore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "=0.4.45", features = ["clock"] }
crossbeam-channel = "0.5.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2"
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=8.0.1", features = ["macos_14_0"] }
