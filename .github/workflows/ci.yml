name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Apple Silicon: Encore's capture path is ScreenCaptureKit and its
    # sidecars are host-architecture only, so it is checked on the same
    # platform it ships for rather than on Linux.
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Prepare ffmpeg sidecars
        run: npm run prepare:ffmpeg-sidecars

      - name: Frontend checks
        run: npm run check

      - name: Frontend build
        run: npm run build

      - name: Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust lint
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

      - name: Harness and quality gates
        run: ./scripts/check-sonata.sh
